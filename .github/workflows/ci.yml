# SPDX-License-Identifier: Apache-2.0
# The gates a PR must pass, in the order a person would run them. Nothing here reads
# a keychain, a certificate store or a state dir of anyone's: the e2e suite builds its
# own fresh state under the runner's temp dir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The bundled-views step looks for ../sessionpipe-gui-themes and skips with a note
      # when it is absent, so a bare clone builds.
      - run: npm run build

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright (desktop + phone, demo mode on :7311 / :7312)
        run: npm run test:e2e

      - name: Playwright (control channel)
        run: npx playwright test -c web/e2e/playwright.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
