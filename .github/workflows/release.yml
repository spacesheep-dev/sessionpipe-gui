# SPDX-License-Identifier: Apache-2.0
# A `v*` tag runs the gates, packs the tarball and creates the GitHub Release (a draft) from
# the CHANGELOG section. The package carries Canvas, Office and ping-a-human from the
# tracked bundled/ copy (refreshed with `npm run bundle:sync`
# from a checkout of sessionpipe-gui-themes beside this repo, and committed), so the
# workflow needs no second checkout and no token. Publishing to npm is off until the
# repository variable PUBLISH_NPM is `true` (RELEASING.md: trusted publishing, the `npm`
# environment); installs come from GitHub: `npx github:spacesheep-dev/sessionpipe-gui`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub Release
  id-token: write # npm trusted publishing + provenance, when PUBLISH_NPM is on

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: gates · pack · release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: The tag is package.json's version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # --require-bundle: the build refuses to ship without the bundled extensions; here
      # they come from the tracked bundled/ copy.
      - run: npm run build:release
      - run: npm run pack:check

      - name: Publish to npm (only when PUBLISH_NPM is true)
        if: vars.PUBLISH_NPM == 'true'
        run: npm install -g npm@latest && npm publish --provenance --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /tmp/notes.md
          npm pack --silent --pack-destination /tmp
          # A draft: the desktop app is built into it ("Desktop release") and the whole
          # release goes out with "Publish update" (RELEASING.md, The desktop app).
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "sessionpipe-gui $GITHUB_REF_NAME" --notes-file /tmp/notes.md /tmp/sessionpipe-gui-*.tgz
