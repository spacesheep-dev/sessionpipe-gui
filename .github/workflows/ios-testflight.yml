# SPDX-License-Identifier: Apache-2.0
# "iOS → TestFlight": a button (Actions → iOS → TestFlight → Run workflow) that builds the
# iOS app for an existing v* tag, signs it for the App Store (manual signing: the Apple
# Distribution certificate and the "sessionpipe App Store" profile, bundle id
# dev.spacesheep.sessionpipe, team QR7H8ARENW), uploads it to TestFlight and waits until
# App Store Connect has processed it. The .ipa is kept as a workflow artifact either way.
# Without a tag it is a dry run of the branch it runs on: built, signed and checked, never
# uploaded.
#
# Runs in the `release` environment (Misha approves it) and reads, by name:
#   IOS_DIST_P12, IOS_DIST_P12_PASSWORD        Apple Distribution certificate + key, .p12 base64
#   IOS_APPSTORE_PROFILE                       "sessionpipe App Store" .mobileprovision, base64
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_PRIVATE_KEY   App Store Connect API key (upload)
# The certificate lives only in a temporary keychain with a random password, deleted at the end.
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "A v* tag to build and upload (empty: a dry run of this branch, never uploaded)"
        required: false
        default: ""
      upload:
        description: "Upload the .ipa to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ inputs.tag || github.ref }}

env:
  TAG: ${{ inputs.tag }}
  UPLOAD: ${{ inputs.tag != '' && inputs.upload }}
  BUILD: ${{ github.run_number }}
  BUNDLE_ID: dev.spacesheep.sessionpipe
  TEAM_ID: QR7H8ARENW
  PROFILE_NAME: sessionpipe App Store
  CARGO_TERM_COLOR: always

jobs:
  testflight:
    name: build, sign, upload
    # App Store Connect takes only builds made with Xcode 26 and the iOS 26 SDK or later
    # (since 2026-04-28); macos-26's default Xcode is one.
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: The tag is package.json's version
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ -z "$TAG" ]; then
            echo "Dry run of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}: built and signed, never uploaded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$TAG" in v*) ;; *) echo "::error::$TAG is not a v* tag"; exit 1 ;; esac
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG, package.json $v"; exit 1; }

      - name: Xcode 26 or later
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "$(xcodebuild -version | tr '\n' ' '), iOS SDK $sdk." >> "$GITHUB_STEP_SUMMARY"
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_ENV"
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::iOS SDK $sdk: App Store Connect takes 26 or later"; exit 1; }

      - name: The secrets this build needs
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          need=(IOS_DIST_P12 IOS_DIST_P12_PASSWORD IOS_APPSTORE_PROFILE)
          [ "$UPLOAD" = true ] && need+=(APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY)
          missing=()
          for s in "${need[@]}"; do [ -n "${!s}" ] || missing+=("$s"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing secrets in the release environment: ${missing[*]} (RELEASING.md, The iOS app)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      # Before the build, so a missing app record or a bad key fails in seconds. The Apple ID
      # goes to altool, which in Xcode 26 can otherwise pick another app by bundle id prefix.
      - name: The app in App Store Connect
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          id="$(node apps/mobile/scripts/asc.mjs app)"
          echo "ASC_APP_ID=$id" >> "$GITHUB_ENV"

      - name: A temporary keychain with the distribution certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/sessionpipe-ios.keychain-db"
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          # Ours first, then the runner's own (so Apple's intermediates still resolve).
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$kc" | grep -q "Apple Distribution" \
            || { echo "::error::IOS_DIST_P12 holds no Apple Distribution identity"; exit 1; }
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: The "sessionpipe App Store" profile
        env:
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/appstore.mobileprovision"
          printf '%s' "$IOS_APPSTORE_PROFILE" | base64 --decode > "$p"
          security cms -D -i "$p" > "$RUNNER_TEMP/profile.plist"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          expires="$(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/profile.plist")"
          [ "$name" = "$PROFILE_NAME" ] || { echo "::error::the profile is \"$name\", not \"$PROFILE_NAME\""; exit 1; }
          [ "$appid" = "$TEAM_ID.$BUNDLE_ID" ] || { echo "::error::the profile is for $appid, not $TEAM_ID.$BUNDLE_ID"; exit 1; }
          [[ "$expires" > "$(date -u +%Y-%m-%dT%H:%M:%SZ)" ]] \
            || { echo "::error::the profile expired on $expires: make a new one (RELEASING.md, The iOS app)"; exit 1; }
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          cp "$p" "$dir/$uuid.mobileprovision"
          rm -f "$p" "$RUNNER_TEMP/profile.plist"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Keyed on the Xcode build: the cache holds build-script output with Xcode's paths in it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target
          key: xcode-${{ env.XCODE_BUILD }}

      - run: npm ci
      - run: npm run build:release
      - run: npm ci
        working-directory: apps/mobile

      # App Store export with manual signing: the named profile for the one bundle id. The
      # build number is ours (BUILD), so Xcode doesn't manage it.
      - name: ExportOptions.plist
        run: |
          set -euo pipefail
          apple=apps/mobile/src-tauri/gen/apple
          cat > "$apple/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$apple/ExportOptions.plist"

      # The release configuration signs with "Apple Distribution" and the
      # "sessionpipe App Store" profile (project.yml / the pbxproj); tauri archives and
      # exports with the ExportOptions.plist above.
      - name: Build and export the .ipa
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # CFBundleVersion is the run number alone: App Store Connect takes one to three
          # integers, and --build-number would append it to the version (0.4.1.12).
          npx tauri ios build --target aarch64 --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD\"}}}" --ci
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit)"
          [ -n "$ipa" ] || { echo "::error::no .ipa was exported"; exit 1; }
          echo "IPA=$PWD/$ipa" >> "$GITHUB_ENV"

      # What App Store Connect checks first, checked here: the ids and numbers, the SDK, the
      # signer, the profile, and no debugger entitlement.
      - name: Check the .ipa
        run: |
          set -euo pipefail
          x="$RUNNER_TEMP/ipa"
          rm -rf "$x" && mkdir -p "$x" && unzip -q "$IPA" -d "$x"
          app="$(find "$x/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          bad() { echo "::error::$*"; exit 1; }
          [ "$(plist CFBundleIdentifier)" = "$BUNDLE_ID" ] || bad "CFBundleIdentifier is $(plist CFBundleIdentifier)"
          [ "$(plist CFBundleShortVersionString)" = "$VERSION" ] || bad "CFBundleShortVersionString is $(plist CFBundleShortVersionString), not $VERSION"
          [ "$(plist CFBundleVersion)" = "$BUILD" ] || bad "CFBundleVersion is $(plist CFBundleVersion), not $BUILD"
          sdk="$(plist DTSDKName)"
          v="${sdk#iphoneos}"
          [ "$v" != "$sdk" ] && [ "${v%%.*}" -ge 26 ] || bad "built with $sdk"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep '^Authority=Apple Distribution: ' >/dev/null || bad "not signed by Apple Distribution"
          codesign -d --entitlements :- "$app" 2>/dev/null > "$x/ent.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$x/ent.plist" 2>/dev/null || echo false)" = false ] \
            || bad "get-task-allow is on: a development build"
          security cms -D -i "$app/embedded.mobileprovision" > "$x/profile.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$x/profile.plist")" = "$PROFILE_NAME" ] || bad "embedded profile is not $PROFILE_NAME"
          [ -f "$app/PrivacyInfo.xcprivacy" ] || bad "no PrivacyInfo.xcprivacy in the app"
          echo "Built $(basename "$IPA") ($(du -h "$IPA" | cut -f1)): $(plist CFBundleDisplayName) $VERSION ($BUILD), $sdk, Apple Distribution, \"$PROFILE_NAME\"." >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$x"

      - uses: actions/upload-artifact@v4
        with:
          name: sessionpipe-ios-${{ env.VERSION }}-${{ github.run_number }}
          path: ${{ env.IPA }}
          if-no-files-found: error

      # altool's exit status isn't trusted (Xcode 26's can be 0 on a failed upload): the
      # build has to show up in App Store Connect, processed, for the run to pass.
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$dir/AuthKey_$APPLE_API_KEY.p8"
          chmod 600 "$dir/AuthKey_$APPLE_API_KEY.p8"
          xcrun altool --upload-app --type ios --file "$IPA" --apple-id "$ASC_APP_ID" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          if grep -E '^\*\*\* Error|ERROR:|UPLOAD FAILED|Failed to upload' "$RUNNER_TEMP/altool.log" >/dev/null; then
            echo "::error::altool: $(grep -E '^\*\*\* Error|ERROR:|UPLOAD FAILED|Failed to upload' "$RUNNER_TEMP/altool.log" | head -1)"
            exit 1
          fi

      - name: App Store Connect processes it
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node apps/mobile/scripts/asc.mjs wait "$VERSION" "$BUILD" 45 | tee "$RUNNER_TEMP/asc.log"
          {
            echo "On TestFlight: $VERSION ($BUILD)."
            grep -E '^TestFlight:|^https://' "$RUNNER_TEMP/asc.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain and the keys
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"
