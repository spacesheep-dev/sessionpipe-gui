<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824 px squircle centred on a 1024 canvas, a soft shadow below it.
       The artwork is the brand mark (web/public/brand/mark.svg) at 51.5x. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f242c"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#171b21"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <g transform="translate(100 100) scale(51.5) translate(8 8.3) scale(0.86) translate(-8 -8)">
    <rect x="3" y="8" width="5" height="2" rx="1" fill="#fbfaf7"/>
    <rect x="3" y="11" width="10" height="2" rx="1" fill="#fbfaf7"/>
    <circle cx="11" cy="5" r="2" fill="#e48e26"/>
  </g>
</svg>
