[package]
name = "sp-receivers"
version = "0.1.0"
description = "sessionpipe's native network layer: the receiver list, discovery, the rx: protocol, the SSE client, needs-you and the status file."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# gzip for an account's answers (hub/acct.rs). Already in both lock files through Tauri;
# inflated by hand so the size limit is on what comes out, not on what went over the wire.
flate2 = "1"
log = "0.4"

# The keychain (keychain.rs): the login keychain on a Mac, the data protection keychain on
# an iPhone. The same crate and version for both, so neither lock file moves.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
