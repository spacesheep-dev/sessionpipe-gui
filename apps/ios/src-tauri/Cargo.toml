[package]
# The name names the Xcode project in gen/apple (sessionpipe-shell.xcodeproj); keep it.
name = "sessionpipe-shell"
version = "0.0.0"
edition = "2021"
publish = false
description = "sessionpipe for iPhone: the Tauri 2 mobile shell (simulator prototype)"

# Its own workspace and lock, so an iOS change never moves the desktop build.
[workspace]

[lib]
name = "sessionpipe_ios"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
http = "1"
tokio = { version = "1", features = ["sync", "time"] }
# The network: shell's crate, shared with the Mac app (receivers, rx:, streams, needs-you).
sp-receivers = { path = "../../crates/sp-receivers" }
# Local notifications (used on iOS; a dependency everywhere so the capability resolves in
# host `cargo test`).
tauri-plugin-notification = "2.7"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
debug = false
