name: sessionpipe-shell
options:
  bundleIdPrefix: dev.spacesheep.sessionpipe
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: sessionpipe
      PRODUCT_BUNDLE_IDENTIFIER: dev.spacesheep.sessionpipe
      DEVELOPMENT_TEAM: QR7H8ARENW
      # Manual signing with the named profiles (RELEASING.md, The iOS app). The simulator
      # needs neither; a device build finds them once install.sh has put them in place.
      CODE_SIGN_STYLE: Manual
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  sessionpipe-shell_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: sessionpipe-shell_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: sessionpipe-shell_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: sessionpipe
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: "0.2.0"
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
        # Receivers on the local network (a computer's receiver over http, by IP or .local).
        NSLocalNetworkUsageDescription: sessionpipe connects to the receiver on your computer over your local network.
        # The QR scanner (tauri-plugin-barcode-scanner refuses to scan without this key).
        NSCameraUsageDescription: sessionpipe reads the code your computer shows, to connect to it.
        NSBonjourServices: [_sessionpipe._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: sessionpipe-shell_iOS/sessionpipe-shell_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      configs:
        debug:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: sessionpipe iOS Development
        release:
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: sessionpipe App Store
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a